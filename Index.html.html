<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Printer Studio Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#0f172a',
                        card: '#1e293b',
                        accent: '#f97316', // Neon Orange maker vibe
                        accentHover: '#ea580c',
                        neonBlue: '#06b6d4',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-darker text-slate-100 min-h-screen flex flex-col selection:bg-accent selection:text-white">

    <!-- Header Navigation -->
    <header class="bg-card border-b border-slate-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-accent/10 text-accent p-2.5 rounded-xl border border-accent/20 flex items-center justify-center">
                    <i class="fa-solid fa-cube text-xl animate-spin-slow"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl tracking-tight text-white">MakerStudio <span class="text-accent">Pro</span></h1>
                    <p class="text-xs text-slate-400 hidden sm:block">Gestione Stampe 3D, Inventario & Manutenzione</p>
                </div>
            </div>

            <!-- Tab Navigation Buttons -->
            <nav class="flex space-x-1 sm:space-x-2 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800">
                <button onclick="switchTab('prints')" id="tab-btn-prints" class="px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center space-x-2 bg-accent text-white shadow-md shadow-accent/20">
                    <i class="fa-solid fa-print"></i>
                    <span class="hidden md:inline">Stampe & Timer</span>
                    <span class="md:hidden">Stampe</span>
                </button>
                <button onclick="switchTab('inventory')" id="tab-btn-inventory" class="px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <span class="hidden md:inline">Inventario</span>
                    <span class="md:hidden">Magazzino</span>
                </button>
                <button onclick="switchTab('maintenance')" id="tab-btn-maintenance" class="px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    <span class="hidden md:inline">Manutenzione</span>
                    <span class="md:hidden">Manutenzione</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- TAB 1: STAMPE & TIMER -->
        <div id="tab-prints" class="space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Form Nuova Stampa -->
                <div class="lg:col-span-1 bg-card border border-slate-800 rounded-2xl p-5 shadow-xl">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                        <h2 class="font-semibold text-lg flex items-center space-x-2 text-white">
                            <i class="fa-solid fa-circle-plus text-accent"></i>
                            <span>Avvia Nuova Stampa</span>
                        </h2>
                    </div>

                    <form id="printForm" onsubmit="handleNewPrint(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Nome Modello *</label>
                            <input type="text" id="printName" required placeholder="Es. Case Raspberry Pi 5" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Ore Stampa *</label>
                                <input type="number" id="printHours" min="0" value="2" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Minuti *</label>
                                <input type="number" id="printMinutes" min="0" max="59" value="30" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Materiale / Filamento</label>
                            <select id="printMaterial" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                                <option value="PLA Bianco">PLA Bianco</option>
                                <option value="PETG Nero">PETG Nero</option>
                                <option value="ABS Grigio">ABS Grigio</option>
                                <option value="TPU Flessibile">TPU Flessibile</option>
                                <option value="Altro / Sconosciuto">Altro / Sconosciuto</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Note / Parametri Slicer</label>
                            <textarea id="printNotes" rows="2" placeholder="Es. Layer 0.2mm, Infill 20%" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition"></textarea>
                        </div>

                        <!-- Dynamic Reminders Section inside Form -->
                        <div class="border-t border-slate-800 pt-3">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-xs font-semibold text-slate-300 flex items-center space-x-1.5">
                                    <i class="fa-solid fa-bell text-neonBlue"></i>
                                    <span>Reminder a Tempo (Minuti dall'avvio)</span>
                                </label>
                                <button type="button" onclick="addReminderRow()" class="text-xs text-accent hover:text-accentHover font-medium flex items-center space-x-1">
                                    <i class="fa-solid fa-plus"></i><span>Aggiungi</span>
                                </button>
                            </div>
                            <div id="remindersContainer" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                                <!-- Default Reminder Example -->
                                <div class="reminder-row flex items-center space-x-2 bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                                    <input type="number" placeholder="Min" value="10" min="0" class="reminder-time w-16 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white text-center">
                                    <input type="text" placeholder="Messaggio (es. Ventola 50%)" value="Imposta ventola al 50%" class="reminder-msg flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                                    <button type="button" onclick="this.parentElement.remove()" class="text-slate-500 hover:text-red-400 px-1.5"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-gradient-to-r from-accent to-accentHover hover:opacity-95 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-accent/20 transition flex items-center justify-center space-x-2 text-sm">
                            <i class="fa-solid fa-play"></i>
                            <span>Avvia Timer Stampa</span>
                        </button>
                    </form>
                </div>

                <!-- Active Prints and Timers List -->
                <div class="lg:col-span-2 space-y-4">
                    <div class="flex items-center justify-between bg-card border border-slate-800 rounded-2xl p-4 shadow-md">
                        <h2 class="font-semibold text-base sm:text-lg flex items-center space-x-2 text-white">
                            <i class="fa-solid fa-stopwatch text-accent"></i>
                            <span>Stampe in Corso & Timer Attivi</span>
                        </h2>
                        <span id="activeCountBadge" class="bg-accent/10 text-accent text-xs font-bold px-3 py-1 rounded-full border border-accent/20">0 attive</span>
                    </div>

                    <div id="activePrintsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Dynamic active prints rendered via JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: GESTORE INVENTARIO -->
        <div id="tab-inventory" class="hidden space-y-6">
            <!-- Sub-tabs for Filaments vs Accessories -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-card border border-slate-800 rounded-2xl p-4 shadow-md">
                <div class="flex space-x-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
                    <button onclick="switchInventorySubTab('filaments')" id="inv-sub-filaments" class="px-4 py-2 rounded-lg text-xs font-semibold transition bg-accent text-white shadow">
                        <i class="fa-solid fa-spool mr-1.5"></i> Filamenti
                    </button>
                    <button onclick="switchInventorySubTab('accessories')" id="inv-sub-accessories" class="px-4 py-2 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white">
                        <i class="fa-solid fa-wrench mr-1.5"></i> Accessori & Ricambi
                    </button>
                </div>

                <button onclick="openInventoryModal()" class="bg-accent hover:bg-accentHover text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-medium shadow-lg shadow-accent/20 transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span id="btnAddInventoryText">Aggiungi Filamento</span>
                </button>
            </div>

            <!-- Filaments Section -->
            <div id="section-filaments" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Rendered dynamically -->
            </div>

            <!-- Accessories Section -->
            <div id="section-accessories" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Rendered dynamically -->
            </div>
        </div>

        <!-- TAB 3: REMINDER MANUTENZIONE -->
        <div id="tab-maintenance" class="hidden space-y-6">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-card border border-slate-800 rounded-2xl p-4 shadow-md">
                <div>
                    <h2 class="font-semibold text-lg text-white flex items-center space-x-2">
                        <i class="fa-solid fa-screwdriver-wrench text-accent"></i>
                        <span>Manutenzione Stampante 3D</span>
                    </h2>
                    <p class="text-xs text-slate-400">Mantieni la stampante in perfetta efficienza registrando le attività periodiche.</p>
                </div>
                <button onclick="openMaintenanceModal()" class="bg-accent hover:bg-accentHover text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-medium shadow-lg shadow-accent/20 transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nuova Attività</span>
                </button>
            </div>

            <div id="maintenanceList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Rendered dynamically -->
            </div>
        </div>

    </main>

    <!-- MODAL: INVENTORY ITEM (ADD/EDIT) -->
    <div id="inventoryModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-card border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeInventoryModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 id="inventoryModalTitle" class="font-bold text-lg text-white mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-boxes-stacked text-accent"></i>
                <span>Aggiungi Elemento</span>
            </h3>

            <form id="inventoryForm" onsubmit="handleSaveInventory(event)" class="space-y-4">
                <input type="hidden" id="invEditId">
                <input type="hidden" id="invCategory" value="filaments">

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nome / Brand *</label>
                    <input type="text" id="invName" required placeholder="Es. Bambu Lab PLA Basic" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                </div>

                <div id="group-filament-fields" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Tipo Materiale</label>
                            <select id="invMaterialType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                                <option value="PLA">PLA</option>
                                <option value="PETG">PETG</option>
                                <option value="ABS">ABS</option>
                                <option value="TPU">TPU</option>
                                <option value="ASA">ASA</option>
                                <option value="Nylon">Nylon</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Colore</label>
                            <input type="text" id="invColor" placeholder="Es. Bianco Neve" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Peso Rimanente (g)</label>
                            <input type="number" id="invWeight" min="0" max="2000" value="1000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Temp. Estrusione (°C)</label>
                            <input type="number" id="invTemp" min="150" max="320" value="210" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                        </div>
                    </div>
                </div>

                <div id="group-accessory-fields" class="space-y-4 hidden">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Quantità Scorta *</label>
                            <input type="number" id="invStockQty" min="0" value="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Soglia Minima Attenzione *</label>
                            <input type="number" id="invStockThreshold" min="0" value="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                        </div>
                    </div>
                </div>

                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="closeInventoryModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-xl transition text-sm">Annulla</button>
                    <button type="submit" class="flex-1 bg-accent hover:bg-accentHover text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-accent/20 transition text-sm">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: MAINTENANCE ITEM (ADD/EDIT) -->
    <div id="maintenanceModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-card border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeMaintenanceModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="font-bold text-lg text-white mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-screwdriver-wrench text-accent"></i>
                <span>Nuova Attività Manutenzione</span>
            </h3>

            <form id="maintenanceForm" onsubmit="handleSaveMaintenance(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Titolo Attività *</label>
                    <input type="text" id="maintTitle" required placeholder="Es. Lubrificazione guide asse Z" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Frequenza / Intervallo *</label>
                    <input type="text" id="maintFreq" required placeholder="Es. Ogni 50 ore di stampa o 30 giorni" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Note Dettagliate</label>
                    <textarea id="maintNotes" rows="2" placeholder="Es. Usare grasso al litio o PTFE..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition"></textarea>
                </div>
                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="closeMaintenanceModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-xl transition text-sm">Annulla</button>
                    <button type="submit" class="flex-1 bg-accent hover:bg-accentHover text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-accent/20 transition text-sm">Salva Attività</button>
                </div>
            </form>
        </div>
    </div>

    <!-- NOTIFICATION TOAST CONTAINER -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-3 max-w-sm w-full pointer-events-none"></div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- GLOBAL STATE & PERSISTENCE ---
        let appState = {
            activePrints: [],
            filaments: [
                { id: 'f1', name: 'Bambu PLA Basic', type: 'PLA', color: 'Bianco', weight: 850, temp: 210 },
                { id: 'f2', name: 'Prusa PETG', type: 'PETG', color: 'Nero Carbone', weight: 420, temp: 240 },
                { id: 'f3', name: 'Sunlu ABS', type: 'ABS', color: 'Grigio Scuro', weight: 900, temp: 250 }
            ],
            accessories: [
                { id: 'a1', name: 'Ugello Acciaio Indurito 0.4mm', qty: 2, threshold: 1 },
                { id: 'a2', name: 'Colla Stick Piatto PEI', qty: 1, threshold: 2 },
                { id: 'a3', name: 'Grasso Lubrificante PTFE', qty: 1, threshold: 1 },
                { id: 'a4', name: 'Tubo PTFE Capricorn', qty: 1, threshold: 1 }
            ],
            maintenance: [
                { id: 'm1', title: 'Lubrificazione Guide Lineari / Viti', freq: 'Ogni 50 ore o 30 giorni', notes: 'Applicare velo sottile di lubrificante compatibile.', status: 'pending', lastCompleted: null },
                { id: 'm2', title: 'Pulizia Piatto Stampa PEI', freq: 'Ogni stampa', notes: 'Pulire con alcool isopropilico al 99.9%.', status: 'pending', lastCompleted: null },
                { id: 'm3', title: 'Controllo Tensione Cinghie X/Y', freq: 'Ogni 150 ore', notes: 'Verificare che le cinghie non siano troppo allentate.', status: 'pending', lastCompleted: null },
                { id: 'm4', title: 'Pulizia Hotend & Ispezione Ugello', freq: 'Ogni 100 ore', notes: 'Controllare presenza di residui di plastica carbonizzata.', status: 'pending', lastCompleted: null }
            ]
        };

        let currentInventorySubTab = 'filaments';

        function loadData() {
            const saved = localStorage.getItem('makerStudioData');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appState.activePrints = parsed.activePrints || [];
                    if (parsed.filaments) appState.filaments = parsed.filaments;
                    if (parsed.accessories) appState.accessories = parsed.accessories;
                    if (parsed.maintenance) appState.maintenance = parsed.maintenance;
                } catch(e) { console.error('Errore caricamento localStorage', e); }
            }
        }

        function saveData() {
            localStorage.setItem('makerStudioData', JSON.stringify({
                activePrints: appState.activePrints,
                filaments: appState.filaments,
                accessories: appState.accessories,
                maintenance: appState.maintenance
            }));
        }

        // --- NAVIGATION TABS ---
        function switchTab(tabId) {
            ['prints', 'inventory', 'maintenance'].forEach(id => {
                const el = document.getElementById(`tab-${id}`);
                const btn = document.getElementById(`tab-btn-${id}`);
                if (id === tabId) {
                    el.classList.remove('hidden');
                    btn.className = "px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center space-x-2 bg-accent text-white shadow-md shadow-accent/20";
                } else {
                    el.classList.add('hidden');
                    btn.className = "px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800";
                }
            });
        }

        function switchInventorySubTab(subTab) {
            currentInventorySubTab = subTab;
            const btnF = document.getElementById('inv-sub-filaments');
            const btnA = document.getElementById('inv-sub-accessories');
            const secF = document.getElementById('section-filaments');
            const secA = document.getElementById('section-accessories');
            const btnText = document.getElementById('btnAddInventoryText');

            if (subTab === 'filaments') {
                btnF.className = "px-4 py-2 rounded-lg text-xs font-semibold transition bg-accent text-white shadow";
                btnA.className = "px-4 py-2 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white";
                secF.classList.remove('hidden');
                secA.classList.add('hidden');
                btnText.innerText = "Aggiungi Filamento";
            } else {
                btnA.className = "px-4 py-2 rounded-lg text-xs font-semibold transition bg-accent text-white shadow";
                btnF.className = "px-4 py-2 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white";
                secA.classList.remove('hidden');
                secF.classList.add('hidden');
                btnText.innerText = "Aggiungi Accessorio";
            }
        }

        // --- NOTIFICATION TOAST SYSTEM ---
        function showToast(title, message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgBorder = 'border-slate-700 bg-card';
            let icon = 'fa-circle-info text-neonBlue';
            if (type === 'success') { bgBorder = 'border-emerald-500/40 bg-card'; icon = 'fa-circle-check text-emerald-400'; }
            if (type === 'warning') { bgBorder = 'border-accent/40 bg-card'; icon = 'fa-triangle-exclamation text-accent'; }

            toast.className = `pointer-events-auto border ${bgBorder} p-4 rounded-2xl shadow-2xl flex items-start space-x-3 transition transform translate-y-2 opacity-0 animate-in fade-in slide-in-from-bottom-5`;
            toast.innerHTML = `
                <div class="pt-0.5"><i class="fa-solid ${icon} text-lg"></i></div>
                <div class="flex-1">
                    <h4 class="font-semibold text-sm text-white">${title}</h4>
                    <p class="text-xs text-slate-300 mt-0.5">${message}</p>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-sm"></i></button>
            `;
            container.appendChild(toast);
            
            // Trigger entrance animation
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);

            // Auto dismiss after 6 seconds
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 6000);
        }

        // --- SECTION 1: STAMPE & TIMER LOGIC ---
        function addReminderRow() {
            const container = document.getElementById('remindersContainer');
            const div = document.createElement('div');
            div.className = "reminder-row flex items-center space-x-2 bg-slate-900/60 p-2 rounded-lg border border-slate-800";
            div.innerHTML = `
                <input type="number" placeholder="Min" value="60" min="0" class="reminder-time w-16 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white text-center">
                <input type="text" placeholder="Messaggio promemoria" value="Cambia temperatura" class="reminder-msg flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                <button type="button" onclick="this.parentElement.remove()" class="text-slate-500 hover:text-red-400 px-1.5"><i class="fa-solid fa-trash-can text-xs"></i></button>
            `;
            container.appendChild(div);
        }

        function handleNewPrint(event) {
            event.preventDefault();
            const name = document.getElementById('printName').value.trim();
            const hours = parseInt(document.getElementById('printHours').value) || 0;
            const minutes = parseInt(document.getElementById('printMinutes').value) || 0;
            const material = document.getElementById('printMaterial').value;
            const notes = document.getElementById('printNotes').value.trim();

            const totalSeconds = (hours * 3600) + (minutes * 60);
            if (totalSeconds <= 0) {
                showToast("Errore Timer", "Inserisci un tempo di stampa maggiore di zero.", "warning");
                return;
            }

            // Gather reminders
            const reminderRows = document.querySelectorAll('.reminder-row');
            let reminders = [];
            reminderRows.forEach(row => {
                const minVal = parseInt(row.querySelector('.reminder-time').value);
                const msgVal = row.querySelector('.reminder-msg').value.trim();
                if (!isNaN(minVal) && msgVal) {
                    reminders.push({
                        timeInSeconds: minVal * 60,
                        message: msgVal,
                        triggered: false
                    });
                }
            });

            // Sort reminders by time
            reminders.sort((a, b) => a.timeInSeconds - b.timeInSeconds);

            const newPrint = {
                id: 'print_' + Date.now(),
                name,
                material,
                notes,
                totalSeconds,
                remainingSeconds: totalSeconds,
                paused: false,
                reminders,
                createdAt: Date.now()
            };

            appState.activePrints.push(newPrint);
            saveData();
            renderActivePrints();
            
            // Reset form
            document.getElementById('printForm').reset();
            document.getElementById('printHours').value = 2;
            document.getElementById('printMinutes').value = 30;
            
            showToast("Stampa Avviata", `Il timer per "${name}" è stato avviato con successo.`, "success");
        }

        function togglePausePrint(id) {
            const p = appState.activePrints.find(item => item.id === id);
            if (p) {
                p.paused = !p.paused;
                saveData();
                renderActivePrints();
            }
        }

        function cancelPrint(id) {
            if (confirm("Vuoi davvero interrompere ed eliminare questo timer di stampa?")) {
                appState.activePrints = appState.activePrints.filter(item => item.id !== id);
                saveData();
                renderActivePrints();
                showToast("Stampa Annullata", "Il timer è stato rimosso.", "warning");
            }
        }

        function renderActivePrints() {
            const container = document.getElementById('activePrintsList');
            const badge = document.getElementById('activeCountBadge');
            badge.innerText = `${appState.activePrints.length} attive`;

            if (appState.activePrints.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-card border border-slate-800 rounded-2xl p-10 text-center text-slate-400">
                        <i class="fa-solid fa-print text-4xl mb-3 text-slate-600"></i>
                        <p class="text-sm font-medium">Nessuna stampa attiva al momento.</p>
                        <p class="text-xs text-slate-500 mt-1">Compila il modulo a sinistra per avviare un nuovo timer.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = appState.activePrints.map(p => {
                const elapsed = p.totalSeconds - p.remainingSeconds;
                const percent = Math.min(100, Math.max(0, (elapsed / p.totalSeconds) * 100));
                
                const hrs = Math.floor(p.remainingSeconds / 3600);
                const mins = Math.floor((p.remainingSeconds % 3600) / 60);
                const secs = p.remainingSeconds % 60;
                const timeStr = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                // Next upcoming reminder
                const nextRem = p.reminders.find(r => !r.triggered);
                const nextRemHtml = nextRem 
                    ? `<div class="text-xs bg-slate-900/80 px-2.5 py-1 rounded-lg border border-slate-800 flex items-center space-x-1.5 text-slate-300">
                         <i class="fa-solid fa-bell text-neonBlue"></i>
                         <span>Prossimo: <strong>${Math.ceil(nextRem.timeInSeconds/60)} min</strong> - ${nextRem.message}</span>
                       </div>`
                    : `<div class="text-xs text-slate-500"><i class="fa-solid fa-check text-emerald-400 mr-1"></i> Tutti i reminder completati</div>`;

                return `
                    <div class="bg-card border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4 relative overflow-hidden">
                        <!-- Top Accent Glow -->
                        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-accent to-neonBlue"></div>

                        <div class="flex items-start justify-between">
                            <div>
                                <span class="text-[10px] font-bold uppercase tracking-wider bg-accent/10 text-accent px-2 py-0.5 rounded border border-accent/20">${p.material}</span>
                                <h3 class="font-bold text-base text-white mt-1">${escapeHtml(p.name)}</h3>
                                ${p.notes ? `<p class="text-xs text-slate-400 mt-0.5">${escapeHtml(p.notes)}</p>` : ''}
                            </div>
                            <div class="text-right">
                                <span class="font-mono text-xl font-bold text-white">${timeStr}</span>
                                <p class="text-[10px] text-slate-400 uppercase tracking-wide">Rimasto</p>
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="space-y-1.5">
                            <div class="flex justify-between text-xs text-slate-400 font-medium">
                                <span>Progresso</span>
                                <span>${percent.toFixed(1)}%</span>
                            </div>
                            <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-800">
                                <div class="bg-gradient-to-r from-accent to-neonBlue h-full transition-all duration-500" style="width: ${percent}%"></div>
                            </div>
                        </div>

                        ${nextRemHtml}

                        <!-- Action Buttons -->
                        <div class="flex items-center space-x-2 pt-2 border-t border-slate-800">
                            <button onclick="togglePausePrint('${p.id}')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded-xl text-xs font-medium transition flex items-center justify-center space-x-1.5">
                                <i class="fa-solid ${p.paused ? 'fa-play text-emerald-400' : 'fa-pause text-accent'}"></i>
                                <span>${p.paused ? 'Riprendi' : 'Pausa'}</span>
                            </button>
                            <button onclick="cancelPrint('${p.id}')" class="bg-slate-800/80 hover:bg-red-950/40 text-slate-400 hover:text-red-400 py-2 px-3 rounded-xl text-xs font-medium transition" title="Annulla Stampa">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Timer Tick Interval Loop (Every 1 second)
        setInterval(() => {
            if (appState.activePrints.length === 0) return;
            let updated = false;

            appState.activePrints.forEach(p => {
                if (!p.paused && p.remainingSeconds > 0) {
                    p.remainingSeconds--;
                    updated = true;

                    const elapsed = p.totalSeconds - p.remainingSeconds;

                    // Check reminders
                    p.reminders.forEach(r => {
                        if (!r.triggered && elapsed >= r.timeInSeconds) {
                            r.triggered = true;
                            showToast(`Reminder Stampa: ${p.name}`, r.message, 'warning');
                        }
                    });

                    // Check completion
                    if (p.remainingSeconds <= 0) {
                        showToast("Stampa Completata! 🎉", `La stampa "${p.name}" è terminata con successo.`, 'success');
                    }
                }
            });

            // Filter out completed prints after notification
            appState.activePrints = appState.activePrints.filter(p => p.remainingSeconds > 0);

            if (updated) {
                saveData();
                renderActivePrints();
            }
        }, 1000);

        // --- SECTION 2: GESTORE INVENTARIO LOGIC ---
        function openInventoryModal(editId = null) {
            const modal = document.getElementById('inventoryModal');
            const form = document.getElementById('inventoryForm');
            form.reset();
            document.getElementById('invEditId').value = '';
            document.getElementById('invCategory').value = currentInventorySubTab;

            const groupF = document.getElementById('group-filament-fields');
            const groupA = document.getElementById('group-accessory-fields');
            const titleEl = document.getElementById('inventoryModalTitle');

            if (currentInventorySubTab === 'filaments') {
                groupF.classList.remove('hidden');
                groupA.classList.add('hidden');
                titleEl.innerHTML = `<i class="fa-solid fa-spool text-accent"></i><span>${editId ? 'Modifica Filamento' : 'Aggiungi Filamento'}</span>`;
            } else {
                groupF.classList.add('hidden');
                groupA.classList.remove('hidden');
                titleEl.innerHTML = `<i class="fa-solid fa-wrench text-accent"></i><span>${editId ? 'Modifica Accessorio' : 'Aggiungi Accessorio'}</span>`;
            }

            if (editId) {
                document.getElementById('invEditId').value = editId;
                if (currentInventorySubTab === 'filaments') {
                    const item = appState.filaments.find(f => f.id === editId);
                    if (item) {
                        document.getElementById('invName').value = item.name;
                        document.getElementById('invMaterialType').value = item.type;
                        document.getElementById('invColor').value = item.color;
                        document.getElementById('invWeight').value = item.weight;
                        document.getElementById('invTemp').value = item.temp;
                    }
                } else {
                    const item = appState.accessories.find(a => a.id === editId);
                    if (item) {
                        document.getElementById('invName').value = item.name;
                        document.getElementById('invStockQty').value = item.qty;
                        document.getElementById('invStockThreshold').value = item.threshold;
                    }
                }
            }

            modal.classList.remove('hidden');
        }

        function closeInventoryModal() {
            document.getElementById('inventoryModal').classList.add('hidden');
        }

        function handleSaveInventory(event) {
            event.preventDefault();
            const editId = document.getElementById('invEditId').value;
            const category = document.getElementById('invCategory').value;
            const name = document.getElementById('invName').value.trim();

            if (category === 'filaments') {
                const type = document.getElementById('invMaterialType').value;
                const color = document.getElementById('invColor').value.trim();
                const weight = parseInt(document.getElementById('invWeight').value) || 0;
                const temp = parseInt(document.getElementById('invTemp').value) || 210;

                if (editId) {
                    const item = appState.filaments.find(f => f.id === editId);
                    if (item) { item.name = name; item.type = type; item.color = color; item.weight = weight; item.temp = temp; }
                } else {
                    appState.filaments.push({ id: 'fil_' + Date.now(), name, type, color, weight, temp });
                }
            } else {
                const qty = parseInt(document.getElementById('invStockQty').value) || 0;
                const threshold = parseInt(document.getElementById('invStockThreshold').value) || 1;

                if (editId) {
                    const item = appState.accessories.find(a => a.id === editId);
                    if (item) { item.name = name; item.qty = qty; item.threshold = threshold; }
                } else {
                    appState.accessories.push({ id: 'acc_' + Date.now(), name, qty, threshold });
                }
            }

            saveData();
            renderInventory();
            closeInventoryModal();
            showToast("Inventario Aggiornato", "Le modifiche sono state salvate con successo.", "success");
        }

        function deleteInventoryItem(category, id) {
            if (confirm("Vuoi davvero eliminare questo elemento dall'inventario?")) {
                if (category === 'filaments') {
                    appState.filaments = appState.filaments.filter(f => f.id !== id);
                } else {
                    appState.accessories = appState.accessories.filter(a => a.id !== id);
                }
                saveData();
                renderInventory();
                showToast("Elemento Eliminato", "L'elemento è stato rimosso dall'inventario.", "warning");
            }
        }

        function renderInventory() {
            // Render Filaments
            const fContainer = document.getElementById('section-filaments');
            if (appState.filaments.length === 0) {
                fContainer.innerHTML = `<div class="col-span-full bg-card border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">Nessun filamento registrato.</div>`;
            } else {
                fContainer.innerHTML = appState.filaments.map(f => {
                    const percent = Math.min(100, Math.max(0, (f.weight / 1000) * 100));
                    let colorBadgeBg = 'bg-accent/10 text-accent border-accent/20';
                    if (f.type === 'PETG') colorBadgeBg = 'bg-neonBlue/10 text-neonBlue border-neonBlue/20';
                    if (f.type === 'ABS') colorBadgeBg = 'bg-purple-500/10 text-purple-400 border-purple-500/20';

                    return `
                        <div class="bg-card border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4">
                            <div class="flex items-start justify-between">
                                <div>
                                    <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${colorBadgeBg}">${f.type}</span>
                                    <h3 class="font-bold text-base text-white mt-1.5">${escapeHtml(f.name)}</h3>
                                    <p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-palette mr-1 text-slate-500"></i> ${escapeHtml(f.color)}</p>
                                </div>
                                <div class="flex space-x-1">
                                    <button onclick="openInventoryModal('${f.id}')" class="text-slate-400 hover:text-white p-1.5"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button onclick="deleteInventoryItem('filaments', '${f.id}')" class="text-slate-400 hover:text-red-400 p-1.5"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                            </div>

                            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between text-xs">
                                <span class="text-slate-400">Temp. Ideale:</span>
                                <span class="font-bold text-white">${f.temp}°C</span>
                            </div>

                            <div class="space-y-1.5">
                                <div class="flex justify-between text-xs font-medium">
                                    <span class="text-slate-400">Spola Rimanente</span>
                                    <span class="text-white">${f.weight}g / 1000g (${percent.toFixed(0)}%)</span>
                                </div>
                                <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-800">
                                    <div class="bg-accent h-full transition-all" style="width: ${percent}%"></div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Render Accessories
            const aContainer = document.getElementById('section-accessories');
            if (appState.accessories.length === 0) {
                aContainer.innerHTML = `<div class="col-span-full bg-card border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">Nessun accessorio registrato.</div>`;
            } else {
                aContainer.innerHTML = appState.accessories.map(a => {
                    const isLow = a.qty <= a.threshold;
                    return `
                        <div class="bg-card border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4">
                            <div class="flex items-start justify-between">
                                <div>
                                    <h3 class="font-bold text-base text-white">${escapeHtml(a.name)}</h3>
                                    ${isLow ? '<span class="inline-flex items-center space-x-1 text-[10px] bg-red-500/10 text-red-400 border border-red-500/20 px-2 py-0.5 rounded mt-1 font-semibold"><i class="fa-solid fa-triangle-exclamation"></i><span>Scorta in esaurimento</span></span>' : '<span class="inline-flex items-center space-x-1 text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded mt-1 font-semibold"><i class="fa-solid fa-check"></i><span>Disponibile</span></span>'}
                                </div>
                                <div class="flex space-x-1">
                                    <button onclick="openInventoryModal('${a.id}')" class="text-slate-400 hover:text-white p-1.5"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button onclick="deleteInventoryItem('accessories', '${a.id}')" class="text-slate-400 hover:text-red-400 p-1.5"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                            </div>

                            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between text-xs">
                                <span class="text-slate-400">Quantità in Magazzino:</span>
                                <span class="font-bold text-white text-sm">${a.qty} unità <span class="text-slate-500 text-[10px]">(Min: ${a.threshold})</span></span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        // --- SECTION 3: MAINTENANCE LOGIC ---
        function openMaintenanceModal() {
            document.getElementById('maintenanceForm').reset();
            document.getElementById('maintenanceModal').classList.remove('hidden');
        }

        function closeMaintenanceModal() {
            document.getElementById('maintenanceModal').classList.add('hidden');
        }

        function handleSaveMaintenance(event) {
            event.preventDefault();
            const title = document.getElementById('maintTitle').value.trim();
            const freq = document.getElementById('maintFreq').value.trim();
            const notes = document.getElementById('maintNotes').value.trim();

            appState.maintenance.push({
                id: 'maint_' + Date.now(),
                title,
                freq,
                notes,
                status: 'pending',
                lastCompleted: null
            });

            saveData();
            renderMaintenance();
            closeMaintenanceModal();
            showToast("Attività Aggiunta", "La nuova attività di manutenzione è stata registrata.", "success");
        }

        function toggleMaintenanceStatus(id) {
            const m = appState.maintenance.find(item => item.id === id);
            if (m) {
                if (m.status === 'pending') {
                    m.status = 'completed';
                    m.lastCompleted = new Date().toLocaleDateString('it-IT');
                    showToast("Manutenzione Completata", `L'attività "${m.title}" è stata segnata come completata. Ottimo lavoro!`, 'success');
                } else {
                    m.status = 'pending';
                }
                saveData();
                renderMaintenance();
            }
        }

        function deleteMaintenanceItem(id) {
            if (confirm("Vuoi eliminare questa attività di manutenzione?")) {
                appState.maintenance = appState.maintenance.filter(item => item.id !== id);
                saveData();
                renderMaintenance();
                showToast("Eliminata", "Attività rimossa.", "warning");
            }
        }

        function renderMaintenance() {
            const container = document.getElementById('maintenanceList');
            if (appState.maintenance.length === 0) {
                container.innerHTML = `<div class="col-span-full bg-card border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">Nessuna attività di manutenzione configurata.</div>`;
                return;
            }

            container.innerHTML = appState.maintenance.map(m => {
                const isCompleted = m.status === 'completed';
                return `
                    <div class="bg-card border ${isCompleted ? 'border-emerald-500/30 bg-emerald-950/10' : 'border-slate-800'} rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4">
                        <div class="flex items-start justify-between">
                            <div class="space-y-1">
                                <div class="flex items-center space-x-2">
                                    <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${isCompleted ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-accent/10 text-accent border-accent/20'}">
                                        ${isCompleted ? 'Completata' : 'Da Fare'}
                                    </span>
                                    <span class="text-xs text-slate-400"><i class="fa-solid fa-clock-rotate-left mr-1"></i> ${escapeHtml(m.freq)}</span>
                                </div>
                                <h3 class="font-bold text-base text-white">${escapeHtml(m.title)}</h3>
                                ${m.notes ? `<p class="text-xs text-slate-400">${escapeHtml(m.notes)}</p>` : ''}
                                ${m.lastCompleted ? `<p class="text-[11px] text-emerald-400/80 font-medium">Ultimo completamento: ${m.lastCompleted}</p>` : ''}
                            </div>
                            <button onclick="deleteMaintenanceItem('${m.id}')" class="text-slate-400 hover:text-red-400 p-1.5"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>

                        <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between">
                            <button onclick="toggleMaintenanceStatus('${m.id}')" class="w-full py-2 px-4 rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-2 ${isCompleted ? 'bg-slate-800 hover:bg-slate-700 text-slate-300' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/20'}">
                                <i class="fa-solid ${isCompleted ? 'fa-arrow-rotate-left' : 'fa-check'}"></i>
                                <span>${isCompleted ? 'Segna da fare' : 'Segna come completata'}</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- UTILITY ---
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // --- INITIALIZATION ---
        window.onload = function() {
            loadData();
            renderActivePrints();
            renderInventory();
            renderMaintenance();
        };
    </script>
</body>
</html>
