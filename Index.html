<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MakerStudio Pro</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{darker:'#0f172a',card:'#1e293b',accent:'#f97316',accentHover:'#ea580c',neonBlue:'#06b6d4'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
@layer components{
.inp{@apply w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition}
.lbl{@apply block text-xs font-medium text-slate-400 mb-1}
.card{@apply bg-card border border-slate-800 rounded-2xl p-5 shadow-xl}
.bar{@apply flex items-center justify-between gap-3 bg-card border border-slate-800 rounded-2xl p-4 shadow-md}
.btn{@apply rounded-xl text-xs sm:text-sm font-medium transition px-4 py-2}
.badge{@apply text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border}
.ico{@apply text-slate-400 hover:text-white p-1.5 text-sm}
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#f1f5f9;color-scheme:dark}
</style>
</head>
<body class="min-h-screen flex flex-col">
<header class="bg-card border-b border-slate-800 sticky top-0 z-40">
 <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
  <div class="flex items-center gap-3">
   <div class="bg-accent/10 border border-accent/20 rounded-xl p-2.5 text-xl">🧊</div>
   <div><h1 class="font-bold text-lg text-white">MakerStudio <span class="text-accent">Pro</span></h1>
   <p class="text-xs text-slate-400 hidden sm:block">Stampe 3D, inventario e manutenzione</p></div>
  </div>
  <nav class="flex gap-1 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800">
   <button data-tab="prints" class="btn">🖨️ Stampe</button>
   <button data-tab="inventory" class="btn">📦 Inventario</button>
   <button data-tab="maintenance" class="btn">🔧 Manutenzione</button>
  </nav>
 </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
 <!-- STAMPE -->
 <section id="tab-prints" class="grid lg:grid-cols-3 gap-6">
  <form id="printForm" class="card space-y-4 lg:col-span-1 self-start">
   <h2 class="font-semibold text-lg text-white pb-3 border-b border-slate-800">➕ Avvia nuova stampa</h2>
   <div><label class="lbl">Nome modello *</label><input id="pName" required class="inp" placeholder="Es. Case Raspberry Pi 5"></div>
   <div class="grid grid-cols-2 gap-3">
    <div><label class="lbl">Ore *</label><input id="pH" type="number" min="0" value="2" required class="inp"></div>
    <div><label class="lbl">Minuti *</label><input id="pM" type="number" min="0" max="59" value="30" required class="inp"></div>
   </div>
   <div><label class="lbl">Filamento (dall’inventario) *</label><select id="pFil" required class="inp"></select></div>
   <div id="filInfo" class="text-xs bg-slate-900/70 border border-slate-800 rounded-xl p-3 text-slate-300"></div>
   <div><label class="lbl">Filamento previsto (g) *</label><input id="pGrams" type="number" min="1" step="0.1" required class="inp" placeholder="Da slicer, es. 35"></div>
   <div><label class="lbl">Note / parametri slicer</label><textarea id="pNotes" rows="2" class="inp" placeholder="Es. Layer 0.2mm, Infill 20%"></textarea></div>
   <div class="border-t border-slate-800 pt-3">
    <div class="flex justify-between mb-2">
     <span class="text-xs font-semibold text-slate-300">🔔 Reminder (minuti dall’avvio)</span>
     <button type="button" id="addRem" class="text-xs text-accent font-medium">+ Aggiungi</button>
    </div>
    <div id="remBox" class="space-y-2 max-h-40 overflow-y-auto"></div>
   </div>
   <button class="btn w-full bg-accent hover:bg-accentHover text-white py-3 shadow-lg shadow-accent/20">▶ Avvia timer stampa</button>
  </form>

  <div class="lg:col-span-2 space-y-4">
   <div class="bar"><h2 class="font-semibold text-lg text-white">⏱️ Stampe in corso</h2>
   <span id="cnt" class="badge bg-accent/10 text-accent border-accent/20 !text-xs !px-3 !py-1 rounded-full"></span></div>
   <div id="printsList" class="grid md:grid-cols-2 gap-4"></div>
  </div>
 </section>

 <!-- INVENTARIO -->
 <section id="tab-inventory" class="hidden space-y-6">
  <div class="bar flex-wrap">
   <div class="flex gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
    <button data-sub="filaments" class="btn !text-xs">🧵 Filamenti</button>
    <button data-sub="accessories" class="btn !text-xs">🔩 Accessori</button>
   </div>
   <button id="addInv" class="btn bg-accent hover:bg-accentHover text-white shadow-lg shadow-accent/20">+ <span id="addInvTxt"></span></button>
  </div>
  <div id="list-filaments" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  <div id="list-accessories" class="hidden grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
 </section>

 <!-- MANUTENZIONE -->
 <section id="tab-maintenance" class="hidden space-y-6">
  <div class="bar flex-wrap">
   <div><h2 class="font-semibold text-lg text-white">🔧 Manutenzione stampante</h2>
   <p class="text-xs text-slate-400">Registra le attività periodiche.</p></div>
   <button id="addMaint" class="btn bg-accent hover:bg-accentHover text-white shadow-lg shadow-accent/20">+ Nuova attività</button>
  </div>
  <div id="maintList" class="grid md:grid-cols-2 gap-4"></div>
 </section>
</main>

<!-- MODAL INVENTARIO -->
<div id="invModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-4">
 <form id="invForm" class="card max-w-md w-full space-y-4 max-h-[92vh] overflow-y-auto">
  <h3 id="invTitle" class="font-bold text-lg text-white"></h3>
  <input type="hidden" id="invId">
  <div><label class="lbl">Nome / brand *</label><input id="iName" required class="inp" placeholder="Es. Bambu Lab PLA Basic"></div>
  <div id="fFields" class="space-y-4">
   <div class="grid grid-cols-2 gap-3">
    <div><label class="lbl">Tipo materiale</label><select id="iType" class="inp"></select></div>
    <div><label class="lbl">Colore</label><input id="iColor" class="inp" placeholder="Es. Bianco neve"></div>
   </div>
   <div class="grid grid-cols-2 gap-3">
    <div><label class="lbl">Peso rimanente (g)</label><input id="iWeight" type="number" min="0" step="0.1" value="1000" class="inp"></div>
    <div><label class="lbl">Peso spool iniziale (g)</label><input id="iCap" type="number" min="1" value="1000" class="inp"></div>
   </div>
   <div class="grid grid-cols-3 gap-3">
    <div><label class="lbl">Ugello °C</label><input id="iTemp" type="number" min="150" max="320" class="inp"></div>
    <div><label class="lbl">Piatto °C</label><input id="iBed" type="number" min="0" max="130" class="inp"></div>
    <div><label class="lbl">Ventola %</label><input id="iFan" type="number" min="0" max="100" class="inp"></div>
   </div>
   <p class="text-[11px] text-slate-500">Cambiando tipo, i valori vengono compilati in automatico (modificabili).</p>
  </div>
  <div id="aFields" class="hidden grid grid-cols-2 gap-3">
   <div><label class="lbl">Quantità scorta</label><input id="iQty" type="number" min="0" value="3" class="inp"></div>
   <div><label class="lbl">Soglia minima</label><input id="iThr" type="number" min="0" value="1" class="inp"></div>
  </div>
  <div class="flex gap-3 pt-2">
   <button type="button" data-close class="btn flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300">Annulla</button>
   <button class="btn flex-1 bg-accent hover:bg-accentHover text-white">Salva</button>
  </div>
 </form>
</div>

<!-- MODAL MANUTENZIONE -->
<div id="maintModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-4">
 <form id="maintForm" class="card max-w-md w-full space-y-4">
  <h3 class="font-bold text-lg text-white">🔧 Nuova attività</h3>
  <div><label class="lbl">Titolo *</label><input id="mTitle" required class="inp" placeholder="Es. Lubrificazione asse Z"></div>
  <div><label class="lbl">Frequenza *</label><input id="mFreq" required class="inp" placeholder="Es. Ogni 50 ore o 30 giorni"></div>
  <div><label class="lbl">Note</label><textarea id="mNotes" rows="2" class="inp"></textarea></div>
  <div class="flex gap-3 pt-2">
   <button type="button" data-close class="btn flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300">Annulla</button>
   <button class="btn flex-1 bg-accent hover:bg-accentHover text-white">Salva</button>
  </div>
 </form>
</div>

<div id="toasts" class="fixed bottom-5 right-5 left-5 sm:left-auto z-[60] flex flex-col gap-3 sm:max-w-sm pointer-events-none"></div>

<script>
const $=id=>document.getElementById(id), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fmt=s=>{s=Math.ceil(s);return [s/3600|0,s%3600/60|0,s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const g1=n=>Math.round(n*10)/10;

// Profili consigliati per materiale: ugello °C, piatto °C, ventola %
const PRESETS={
 PLA:{temp:210,bed:60,fan:100}, PETG:{temp:235,bed:80,fan:50}, ABS:{temp:245,bed:100,fan:20},
 ASA:{temp:250,bed:100,fan:20}, TPU:{temp:225,bed:50,fan:60}, Nylon:{temp:255,bed:80,fan:30}
};
const mk=(id,name,type,color,weight)=>({id,name,type,color,weight,cap:1000,...PRESETS[type]});
const DEF=()=>({
 prints:[],
 filaments:[mk('f1','Bambu PLA Basic','PLA','Bianco',850),mk('f2','Prusa PETG','PETG','Nero Carbone',420),mk('f3','Sunlu ABS','ABS','Grigio Scuro',900)],
 accessories:[{id:'a1',name:'Ugello acciaio 0.4mm',qty:2,threshold:1},{id:'a2',name:'Colla stick piatto PEI',qty:1,threshold:2},{id:'a3',name:'Grasso PTFE',qty:1,threshold:1},{id:'a4',name:'Tubo PTFE Capricorn',qty:1,threshold:1}],
 maintenance:[
  {id:'m1',title:'Lubrificazione guide e viti',freq:'Ogni 50 ore o 30 giorni',notes:'Velo sottile di lubrificante compatibile.',done:false,last:null},
  {id:'m2',title:'Pulizia piatto PEI',freq:'Ogni stampa',notes:'Alcool isopropilico.',done:false,last:null},
  {id:'m3',title:'Controllo tensione cinghie X/Y',freq:'Ogni 150 ore',notes:'',done:false,last:null},
  {id:'m4',title:'Pulizia hotend e ugello',freq:'Ogni 100 ore',notes:'Cerca residui carbonizzati.',done:false,last:null}]
});
const KEY='makerStudioV2';
let S=DEF(), sub='filaments';

function load(){
 try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(p)Object.keys(S).forEach(k=>{if(Array.isArray(p[k]))S[k]=p[k]})}catch(e){}
 S.filaments.forEach(f=>{const d=PRESETS[f.type]||PRESETS.PLA;f.bed??=d.bed;f.fan??=d.fan;f.temp??=d.temp;f.cap??=Math.max(1000,f.weight)});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function toast(title,msg,type='info'){
 const c={success:'border-emerald-500/40',warning:'border-accent/40',info:'border-slate-700'}[type];
 const t=document.createElement('div');
 t.className=`pointer-events-auto bg-card border ${c} p-4 rounded-2xl shadow-2xl transition-opacity duration-300`;
 t.innerHTML=`<h4 class="font-semibold text-sm text-white">${esc(title)}</h4><p class="text-xs text-slate-300 mt-0.5">${esc(msg)}</p>`;
 t.onclick=()=>t.remove();
 $('toasts').append(t);
 setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},6000);
}

// ---------- NAVIGAZIONE ----------
const ON='bg-accent text-white shadow-md shadow-accent/20', OFF='text-slate-400 hover:text-white hover:bg-slate-800';
function setTab(t){
 $$('[data-tab]').forEach(b=>{const on=b.dataset.tab===t;b.classList.remove(...ON.split(' '),...OFF.split(' '));b.classList.add(...(on?ON:OFF).split(' '));$('tab-'+b.dataset.tab).classList.toggle('hidden',!on)});
}
function setSub(s){
 sub=s;
 $$('[data-sub]').forEach(b=>{const on=b.dataset.sub===s;b.classList.remove(...ON.split(' '),...OFF.split(' '));b.classList.add(...(on?ON:OFF).split(' '));$('list-'+b.dataset.sub).classList.toggle('hidden',!on)});
 $('addInvTxt').textContent=s==='filaments'?'Aggiungi filamento':'Aggiungi accessorio';
}
const modal=(id,open)=>{$(id).classList.toggle('hidden',!open);$(id).classList.toggle('flex',open)};

// ---------- STAMPE ----------
const left=p=>p.paused?p.remaining:Math.max(0,(p.endAt-Date.now())/1000);
const filById=id=>S.filaments.find(f=>f.id===id);

function addRemRow(min=10,msg='Imposta ventola al 50%'){
 const d=document.createElement('div');
 d.className='rem flex items-center gap-2 bg-slate-900/60 p-2 rounded-lg border border-slate-800';
 d.innerHTML=`<input type="number" min="0" value="${min}" class="rt w-16 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white text-center"><input value="${esc(msg)}" class="rm flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white"><button type="button" class="text-slate-500 hover:text-red-400 px-1.5">🗑️</button>`;
 d.querySelector('button').onclick=()=>d.remove();
 $('remBox').append(d);
}

function refreshFilSelect(){
 const sel=$('pFil'),cur=sel.value;
 sel.innerHTML=S.filaments.length
  ?S.filaments.map(f=>`<option value="${f.id}">${esc(f.name)} · ${f.type} ${esc(f.color)} (${Math.round(f.weight)}g)</option>`).join('')
  :'<option value="">Nessun filamento: aggiungilo in Inventario</option>';
 if(filById(cur))sel.value=cur;
 refreshFilInfo();
}
function refreshFilInfo(){
 const f=filById($('pFil').value);
 $('filInfo').innerHTML=f
  ?`🌡️ Ugello <b>${f.temp}°C</b> · Piatto <b>${f.bed}°C</b> · Ventola <b>${f.fan}%</b><br>🧵 Disponibili <b>${Math.round(f.weight)}g</b> su ${f.cap}g`
  :'<span class="text-slate-500">Seleziona un filamento per vedere i parametri.</span>';
}

function startPrint(e){
 e.preventDefault();
 const f=filById($('pFil').value);
 if(!f)return toast('Filamento mancante','Aggiungi e seleziona un filamento dall’inventario.','warning');
 const total=(+$('pH').value||0)*3600+(+$('pM').value||0)*60;
 const grams=+$('pGrams').value;
 if(total<=0)return toast('Errore timer','Inserisci un tempo maggiore di zero.','warning');
 if(!(grams>0))return toast('Errore','Inserisci i grammi previsti.','warning');
 if(grams>f.weight&&!confirm(`Servono ${grams}g ma ne restano ${Math.round(f.weight)}g. Avviare comunque?`))return;
 const reminders=[...$$('.rem')].map(r=>({at:(parseInt(r.querySelector('.rt').value)||0)*60,msg:r.querySelector('.rm').value.trim(),done:false})).filter(r=>r.msg).sort((a,b)=>a.at-b.at);
 S.prints.push({id:uid('p'),name:$('pName').value.trim(),filId:f.id,filName:f.name,mat:f.type,grams,notes:$('pNotes').value.trim(),total,remaining:total,endAt:Date.now()+total*1000,paused:false,reminders});
 save();renderPrints();
 $('printForm').reset();$('pH').value=2;$('pM').value=30;refreshFilInfo();
 toast('Stampa avviata',`Timer avviato. Verranno scalati ${grams}g da ${f.name} al termine.`,'success');
}

// Scala il filamento dalla spool (frac = quota di stampa effettivamente eseguita)
function consume(p,frac){
 const used=g1(p.grams*frac),f=filById(p.filId);
 if(f)f.weight=Math.max(0,g1(f.weight-used));
 return used;
}
function finish(p,frac){
 const used=consume(p,frac);
 S.prints=S.prints.filter(x=>x!==p);
 save();renderPrints();renderInventory();refreshFilSelect();
 return used;
}
function pause(id){
 const p=S.prints.find(x=>x.id===id);if(!p)return;
 if(p.paused){p.paused=false;p.endAt=Date.now()+p.remaining*1000}
 else{p.remaining=left(p);p.paused=true}
 save();renderPrints();
}
function cancel(id){
 const p=S.prints.find(x=>x.id===id);
 if(!p||!confirm('Interrompere questa stampa? Verrà scalato il filamento già usato.'))return;
 const used=finish(p,(p.total-left(p))/p.total);
 toast('Stampa annullata',`Scalati ${used}g da ${p.filName}.`,'warning');
}

function renderPrints(){
 $('cnt').textContent=`${S.prints.length} attive`;
 $('printsList').innerHTML=S.prints.length?S.prints.map(p=>{
  const next=p.reminders.find(r=>!r.done);
  return `<div class="card flex flex-col gap-4 relative overflow-hidden">
   <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-accent to-neonBlue"></div>
   <div class="flex justify-between items-start gap-2">
    <div><span class="badge bg-accent/10 text-accent border-accent/20">${esc(p.mat)}</span>
     <h3 class="font-bold text-white mt-1">${esc(p.name)}</h3>
     <p class="text-xs text-slate-400">${esc(p.filName)} · ${p.grams}g${p.notes?' · '+esc(p.notes):''}</p></div>
    <div class="text-right"><span data-t="${p.id}" class="font-mono text-xl font-bold text-white"></span><p class="text-[10px] text-slate-400 uppercase">Rimasto</p></div>
   </div>
   <div><div class="flex justify-between text-xs text-slate-400 mb-1"><span>Progresso</span><span data-pc="${p.id}"></span></div>
    <div class="bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-800"><div data-b="${p.id}" class="bg-gradient-to-r from-accent to-neonBlue h-full"></div></div></div>
   <div class="text-xs text-slate-300 bg-slate-900/80 border border-slate-800 rounded-lg px-2.5 py-1">${next?`🔔 Prossimo: <b>${Math.ceil(next.at/60)} min</b> – ${esc(next.msg)}`:'✅ Tutti i reminder completati'}</div>
   <div class="flex gap-2 pt-2 border-t border-slate-800">
    <button onclick="pause('${p.id}')" class="btn flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200">${p.paused?'▶ Riprendi':'⏸ Pausa'}</button>
    <button onclick="cancel('${p.id}')" class="btn bg-slate-800 hover:bg-red-950/40 text-slate-400 hover:text-red-400" title="Annulla">🗑️</button>
   </div></div>`}).join('')
  :'<div class="card col-span-full text-center text-slate-400 p-10"><div class="text-4xl mb-2">🖨️</div><p class="text-sm">Nessuna stampa attiva.</p></div>';
 updateTimers();
}
function updateTimers(){
 S.prints.forEach(p=>{
  const r=left(p),pc=Math.min(100,(p.total-r)/p.total*100);
  const t=document.querySelector(`[data-t="${p.id}"]`);if(!t)return;
  t.textContent=fmt(r);
  document.querySelector(`[data-pc="${p.id}"]`).textContent=pc.toFixed(1)+'%';
  document.querySelector(`[data-b="${p.id}"]`).style.width=pc+'%';
 });
}
function tick(){
 let changed=false;
 [...S.prints].forEach(p=>{
  const r=left(p),el=p.total-r;
  p.reminders.forEach(x=>{if(!x.done&&el>=x.at){x.done=true;changed=true;toast('Reminder: '+p.name,x.msg,'warning')}});
  if(r<=0){const u=finish(p,1);toast('Stampa completata 🎉',`"${p.name}" terminata. Scalati ${u}g da ${p.filName}.`,'success')}
 });
 if(changed){save();renderPrints()}else updateTimers();
}

// ---------- INVENTARIO ----------
function openInv(id=null){
 $('invForm').reset();$('invId').value=id||'';
 const isF=sub==='filaments';
 $('fFields').classList.toggle('hidden',!isF);$('aFields').classList.toggle('hidden',isF);
 $('invTitle').textContent=(id?'Modifica ':'Aggiungi ')+(isF?'filamento':'accessorio');
 if(isF){applyPreset($('iType').value='PLA');$('iWeight').value=1000;$('iCap').value=1000}
 else{$('iQty').value=3;$('iThr').value=1}
 const it=(isF?S.filaments:S.accessories).find(x=>x.id===id);
 if(it){
  $('iName').value=it.name;
  if(isF){$('iType').value=it.type;$('iColor').value=it.color;$('iWeight').value=it.weight;$('iCap').value=it.cap;$('iTemp').value=it.temp;$('iBed').value=it.bed;$('iFan').value=it.fan}
  else{$('iQty').value=it.qty;$('iThr').value=it.threshold}
 }
 modal('invModal',true);
}
function applyPreset(type){const p=PRESETS[type];if(!p)return;$('iTemp').value=p.temp;$('iBed').value=p.bed;$('iFan').value=p.fan}

function saveInv(e){
 e.preventDefault();
 const id=$('invId').value,name=$('iName').value.trim();
 if(sub==='filaments'){
  const d={name,type:$('iType').value,color:$('iColor').value.trim(),weight:+$('iWeight').value||0,cap:+$('iCap').value||1000,temp:+$('iTemp').value||210,bed:+$('iBed').value||0,fan:Math.min(100,+$('iFan').value||0)};
  const it=filById(id);it?Object.assign(it,d):S.filaments.push({id:uid('fil'),...d});
 }else{
  const d={name,qty:+$('iQty').value||0,threshold:+$('iThr').value||0};
  const it=S.accessories.find(a=>a.id===id);it?Object.assign(it,d):S.accessories.push({id:uid('acc'),...d});
 }
 save();renderInventory();refreshFilSelect();modal('invModal',false);
 toast('Inventario aggiornato','Modifiche salvate.','success');
}
function delInv(cat,id){
 if(!confirm('Eliminare questo elemento?'))return;
 S[cat]=S[cat].filter(x=>x.id!==id);
 save();renderInventory();refreshFilSelect();
}
function renderInventory(){
 const cols={PLA:'bg-accent/10 text-accent border-accent/20',PETG:'bg-neonBlue/10 text-neonBlue border-neonBlue/20',ABS:'bg-purple-500/10 text-purple-400 border-purple-500/20'};
 const acts=(cat,id)=>`<div class="flex"><button class="ico" onclick="openInv('${id}')">✏️</button><button class="ico hover:!text-red-400" onclick="delInv('${cat}','${id}')">🗑️</button></div>`;
 $('list-filaments').innerHTML=S.filaments.length?S.filaments.map(f=>{
  const pc=Math.min(100,f.weight/f.cap*100),low=pc<15;
  return `<div class="card flex flex-col gap-4">
   <div class="flex justify-between items-start"><div>
    <span class="badge ${cols[f.type]||'bg-slate-700/40 text-slate-300 border-slate-600'}">${f.type}</span>
    <h3 class="font-bold text-white mt-1.5">${esc(f.name)}</h3><p class="text-xs text-slate-400">🎨 ${esc(f.color)}</p></div>${acts('filaments',f.id)}</div>
   <div class="grid grid-cols-3 gap-2 text-center text-xs bg-slate-900/60 border border-slate-800 rounded-xl p-3">
    <div><p class="text-slate-400">Ugello</p><b class="text-white">${f.temp}°C</b></div>
    <div><p class="text-slate-400">Piatto</p><b class="text-white">${f.bed}°C</b></div>
    <div><p class="text-slate-400">Ventola</p><b class="text-white">${f.fan}%</b></div></div>
   <div><div class="flex justify-between text-xs font-medium mb-1"><span class="text-slate-400">Spool rimanente${low?' ⚠️ quasi finita':''}</span><span class="text-white">${Math.round(f.weight)}g / ${f.cap}g (${pc.toFixed(0)}%)</span></div>
    <div class="bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-800"><div class="${low?'bg-red-500':'bg-accent'} h-full transition-all" style="width:${pc}%"></div></div></div></div>`}).join('')
  :'<div class="card col-span-full text-center text-slate-400 text-sm">Nessun filamento registrato.</div>';
 $('list-accessories').innerHTML=S.accessories.length?S.accessories.map(a=>{
  const low=a.qty<=a.threshold;
  return `<div class="card flex flex-col gap-4"><div class="flex justify-between items-start"><div>
   <h3 class="font-bold text-white">${esc(a.name)}</h3>
   <span class="badge mt-1 inline-block ${low?'bg-red-500/10 text-red-400 border-red-500/20':'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'}">${low?'⚠️ Scorta in esaurimento':'✓ Disponibile'}</span></div>${acts('accessories',a.id)}</div>
   <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex justify-between text-xs"><span class="text-slate-400">In magazzino</span><b class="text-white text-sm">${a.qty} <span class="text-slate-500 text-[10px]">(min ${a.threshold})</span></b></div></div>`}).join('')
  :'<div class="card col-span-full text-center text-slate-400 text-sm">Nessun accessorio registrato.</div>';
}

// ---------- MANUTENZIONE ----------
function saveMaint(e){
 e.preventDefault();
 S.maintenance.push({id:uid('m'),title:$('mTitle').value.trim(),freq:$('mFreq').value.trim(),notes:$('mNotes').value.trim(),done:false,last:null});
 save();renderMaint();modal('maintModal',false);
 toast('Attività aggiunta','Registrata con successo.','success');
}
function toggleMaint(id){
 const m=S.maintenance.find(x=>x.id===id);if(!m)return;
 m.done=!m.done;m.last=m.done?new Date().toLocaleDateString('it-IT'):m.last;
 if(m.done)toast('Manutenzione completata',m.title,'success');
 save();renderMaint();
}
function delMaint(id){if(confirm('Eliminare questa attività?')){S.maintenance=S.maintenance.filter(x=>x.id!==id);save();renderMaint()}}
function renderMaint(){
 $('maintList').innerHTML=S.maintenance.length?S.maintenance.map(m=>`
  <div class="card flex flex-col gap-4 ${m.done?'!border-emerald-500/30':''}">
   <div class="flex justify-between items-start"><div class="space-y-1">
    <div class="flex items-center gap-2 flex-wrap"><span class="badge ${m.done?'bg-emerald-500/10 text-emerald-400 border-emerald-500/20':'bg-accent/10 text-accent border-accent/20'}">${m.done?'Completata':'Da fare'}</span><span class="text-xs text-slate-400">🕒 ${esc(m.freq)}</span></div>
    <h3 class="font-bold text-white">${esc(m.title)}</h3>
    ${m.notes?`<p class="text-xs text-slate-400">${esc(m.notes)}</p>`:''}
    ${m.last?`<p class="text-[11px] text-emerald-400/80">Ultimo completamento: ${m.last}</p>`:''}</div>
    <button class="ico hover:!text-red-400" onclick="delMaint('${m.id}')">🗑️</button></div>
   <button onclick="toggleMaint('${m.id}')" class="btn w-full ${m.done?'bg-slate-800 hover:bg-slate-700 text-slate-300':'bg-emerald-600 hover:bg-emerald-500 text-white'}">${m.done?'↩ Segna da fare':'✓ Segna come completata'}</button></div>`).join('')
  :'<div class="card col-span-full text-center text-slate-400 text-sm">Nessuna attività configurata.</div>';
}

// ---------- INIT ----------
$$('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$$('[data-sub]').forEach(b=>b.onclick=()=>setSub(b.dataset.sub));
$$('[data-close]').forEach(b=>b.onclick=()=>{modal('invModal',false);modal('maintModal',false)});
$('iType').innerHTML=Object.keys(PRESETS).map(t=>`<option>${t}</option>`).join('');
$('iType').onchange=e=>applyPreset(e.target.value);
$('pFil').onchange=refreshFilInfo;
$('addRem').onclick=()=>addRemRow(60,'Cambia temperatura');
$('addInv').onclick=()=>openInv();
$('addMaint').onclick=()=>{$('maintForm').reset();modal('maintModal',true)};
$('printForm').onsubmit=startPrint;
$('invForm').onsubmit=saveInv;
$('maintForm').onsubmit=saveMaint;

load();addRemRow();setTab('prints');setSub('filaments');
renderInventory();renderMaint();refreshFilSelect();renderPrints();
tick();setInterval(tick,1000);
</script>
</body>
</html>
